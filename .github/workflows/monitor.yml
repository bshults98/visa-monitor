# Hosted monitor: polls the Indian visa country dropdown and publishes a
# static dashboard to GitHub Pages.
#
# WHY LONG JOBS INSTEAD OF MANY SHORT CRON RUNS
# ---------------------------------------------
# GitHub's scheduler proved unreliable with ~96 short runs/day: scheduled
# runs arrive late or get dropped, and the `concurrency` group (which must
# exist to stop runs racing on the shared `data` branch) keeps only one run
# pending -- so a long job silently cancels everything queued behind it.
#
# Instead: one job every 2 hours, each looping internally for 2h10m. That is
# 12 scheduled events per day instead of 96, with continuous coverage and no
# queue contention. The monitor's own scheduler picks the poll interval:
# 60-90s while inside a reset window, 15 min otherwise.
#
# SCHEDULING NOTES (from GitHub's own docs)
# ----------------------------------------
#   * The shortest `schedule` interval is 5 minutes.
#   * Scheduled runs are often DELAYED at the top of every hour and may be
#     dropped under load, so every trigger sits at :07 rather than :00.
#   * All cron fields are UTC. Bangladesh Standard Time is UTC+6:
#         00:00-00:30 BST  ==  18:00-18:30 UTC (previous day)
#         08:00-09:30 BST  ==  02:00-03:30 UTC
#     Jobs overlap slightly (2h10m run on a 2h trigger) so a delayed start
#     never leaves a gap.
#
# STATE
# -----
# samples.jsonl / transitions.jsonl / state.json are force-pushed to the
# `data` branch as a SINGLE parentless commit each run, so the branch never
# accumulates history while the files themselves retain the full window.
#
# `WEBHOOK_URL` and `DASH_PASSPHRASE` come from repository secrets and are
# never written into this file, so it is safe to keep the repo public.
name: monitor

on:
  schedule:
    # Every 2 hours at :07. Covers 00:00-00:30 and 08:00-09:30 BST because
    # each job spans 2h10m and the monitor polls fast inside those windows.
    - cron: "7 */2 * * *"
  workflow_dispatch:
    inputs:
      burst_minutes:
        description: "Poll fast for N minutes (0 = a single baseline check)"
        default: "0"
        required: false

# One monitor at a time: every run writes the same `data` branch.
concurrency:
  group: monitor
  cancel-in-progress: false

permissions:
  contents: write # push the `data` branch
  pages: write # deploy the dashboard
  id-token: write # Pages OIDC

jobs:
  monitor:
    runs-on: ubuntu-latest
    # A 2h10m run needs headroom above its own loop time.
    timeout-minutes: 160
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Restore runtime state from data branch
        run: |
          set -euo pipefail
          mkdir -p data
          if git fetch origin data 2>/dev/null && git rev-parse --verify origin/data >/dev/null 2>&1; then
            git checkout origin/data -- data state.json
            echo "restored $(wc -l < data/samples.jsonl 2>/dev/null || echo 0) samples"
          else
            echo "no data branch yet - starting fresh"
          fi

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install --disable-pip-version-check -r requirements.txt

      - name: Decide run mode
        id: mode
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            burst="${{ github.event.inputs.burst_minutes }}"
            burst="${burst:-0}"
            echo "burst=$burst" >> "$GITHUB_OUTPUT"
            echo "force_fast=$([ "$burst" -gt 0 ] && echo 1 || echo 0)" >> "$GITHUB_OUTPUT"
            echo "manual dispatch: burst=$burst min"
            exit 0
          fi
          # Scheduled: one long run spanning the next two hours. The monitor
          # itself switches to 60-90s polling whenever it is inside a BST
          # reset window, so --force-fast is deliberately NOT passed here.
          echo "burst=130" >> "$GITHUB_OUTPUT"
          echo "force_fast=0" >> "$GITHUB_OUTPUT"
          echo "scheduled: 2h10m continuous run, schedule-aware intervals"

      - name: Run monitor
        env:
          WEBHOOK_URL: ${{ secrets.WEBHOOK_URL }}
          DASH_PASSPHRASE: ${{ secrets.DASH_PASSPHRASE }}
        run: |
          set -euo pipefail
          burst="${{ steps.mode.outputs.burst }}"
          fast="${{ steps.mode.outputs.force_fast }}"
          if [ "$burst" -gt 0 ]; then
            args="--burst-min $burst --no-startup-webhook"
            [ "$fast" = "1" ] && args="$args --force-fast"
            echo ">>> looping for ${burst} min"
            python monitor.py $args
          else
            echo ">>> single baseline check"
            python monitor.py --once
          fi

      - name: Render dashboard
        env:
          DASH_PASSPHRASE: ${{ secrets.DASH_PASSPHRASE }}
          PAGES_CNAME: ${{ vars.PAGES_CNAME }}
        run: python monitor.py --render

      - name: Save runtime state to data branch
        env:
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
        run: |
          set -euo pipefail
          # Parentless commit + force push: the branch keeps exactly one
          # snapshot, so repo size stays constant however long it runs.
          export GIT_INDEX_FILE=/tmp/state.index
          git read-tree --empty
          git add -f data state.json
          tree=$(git write-tree)
          commit=$(git commit-tree "$tree" -m "state $(date -u +%FT%TZ)")
          git push --force origin "$commit:refs/heads/data"
          echo "pushed state snapshot $commit"

      - name: Upload dashboard artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
