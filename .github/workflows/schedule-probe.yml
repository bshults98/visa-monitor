# Diagnostic: does `schedule` fire at all in this repository?
#
# The main monitor workflow's crons have produced no scheduled runs even
# though workflow_dispatch on the very same file succeeds. This probe has a
# single job and a `*/5` cron so it removes every other variable (secrets,
# Pages environment, concurrency, data-branch pushes) from the picture.
#
# If this fires and monitor.yml still does not, the fault is in monitor.yml's
# config. If this also never fires, the repository has a scheduling problem
# at the GitHub level.
name: schedule-probe

on:
  push:
    paths:
      - ".github/workflows/schedule-probe.yml"
  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: read

jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Echo
        run: |
          echo "trigger=${{ github.event_name }}"
          echo "fired at $(date -u +%Y-%m-%dT%H:%M:%SZ)"
