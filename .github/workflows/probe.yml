# Egress probe: can a GitHub Actions runner reach indianvisaonline.gov.in ?
#
# This is the decision gate for the whole hosting strategy. We already know:
#   - residential egress (your PC)          -> 200 OK
#   - Decodo ISP proxies (10 IPs)           -> 403 / connect fail
#   - corsproxy.io (Cloudflare egress)      -> 403
#   - allorigins (Cloudflare egress)        -> 522
#   - r.jina.ai (their own egress)          -> 200 (retry)
# GitHub Actions runs on Azure, which is untested. Until this passes, no
# other hosted option is worth building against.
#
# Trigger manually from the Actions tab, or via:
#   POST /repos/{owner}/{repo}/actions/workflows/probe.yml/dispatches
name: probe

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reachability:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: pip install --disable-pip-version-check requests

      - name: Probe target
        env:
          PROBE_MODE: "1"
        run: |
          python - <<'PY'
          import os, json, sys, time
          import requests

          UA = ("Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 "
                "(KHTML, like Gecko) Chrome/126.0.0.0 Safari/537.36")
          URL = "https://indianvisaonline.gov.in/visa/Registration"
          out = {"runner_ip": None, "steps": []}

          # 1) where are we egressing from?
          try:
              out["runner_ip"] = requests.get(
                  "https://api.ipify.org?format=json", timeout=20
              ).json().get("ip")
          except Exception as e:
              out["steps"].append({"step": "ipify", "error": str(e)})

          s = requests.Session()
          s.headers.update({"User-Agent": UA,
                            "Accept-Language": "en-US,en;q=0.9"})

          # 2) GET landing page (session cookies)
          t0 = time.time()
          try:
              r = s.get(URL, timeout=45)
              out["steps"].append({
                  "step": "GET", "status": r.status_code,
                  "bytes": len(r.content),
                  "ms": int((time.time() - t0) * 1000),
                  "server": r.headers.get("Server"),
              })
          except Exception as e:
              out["steps"].append({"step": "GET", "error": str(e)})
              print(json.dumps(out, indent=2)); sys.exit(1)

          # 3) POST to render the form
          t0 = time.time()
          try:
              r = s.post(URL,
                         data={"service_requested": "1", "requestedPage": ""},
                         headers={"Referer": URL,
                                  "Origin": "https://indianvisaonline.gov.in"},
                         allow_redirects=False, timeout=45)
              body = r.text
              out["steps"].append({
                  "step": "POST", "status": r.status_code,
                  "bytes": len(body),
                  "ms": int((time.time() - t0) * 1000),
                  "location": r.headers.get("Location"),
              })
          except Exception as e:
              out["steps"].append({"step": "POST", "error": str(e)})
              print(json.dumps(out, indent=2)); sys.exit(1)

          # 4) can we read the dropdown we actually monitor?
          import re
          m = re.search(r"(?is)<select[^>]*\bname\s*=\s*['\"]"
                        r"appl\.countryname['\"][^>]*>(.*?)</select>", body)
          if m:
              opts = re.findall(
                  r"(?is)<option[^>]*value\s*=\s*['\"]([^'\"]*)['\"][^>]*>(.*?)</option>",
                  m.group(1),
              )
              bd = any("BANGLADESH" in re.sub(r"\s+", " ", t).upper()
                       or v.upper() == "BGD" for v, t in opts)
              out["steps"].append({
                  "step": "PARSE", "select_found": True,
                  "option_count": len(opts), "bangladesh_present": bd,
              })
          else:
              out["steps"].append({"step": "PARSE", "select_found": False,
                                   "body_head": body[:300]})

          print(json.dumps(out, indent=2))
          blocked = (not out["steps"] or
                     out["steps"][-1].get("select_found") is False)
          sys.exit(1 if blocked else 0)
          PY
